# Draft of `metadata/com.balancecalories.yml` for fdroiddata.
#
# This file is the merge-request payload for https://gitlab.com/fdroid/fdroiddata, not something the build
# reads. It is kept here so the recipe can be reviewed together with the commit it builds.
#
# Fill in `<github-user>` before submitting, and submit the commit hash that carries the `v1.0.0` tag.

Categories:
  - Sports & Health
License: Apache-2.0
AuthorName: Michael (BalanceCalories)
WebSite: https://github.com/<github-user>/BalanceCalories
SourceCode: https://github.com/<github-user>/BalanceCalories
IssueTracker: https://github.com/<github-user>/BalanceCalories/issues
Changelog: https://github.com/<github-user>/BalanceCalories/releases

AutoName: Balance Calories

RepoType: git
Repo: https://github.com/<github-user>/BalanceCalories.git

Builds:
  - versionName: 1.0.0
    versionCode: 2
    commit: v1.0.0
    subdir: app
    gradle:
      - yes
    # The release build is unsigned unless keystore.properties exists, which is exactly what F-Droid wants:
    # it signs with its own key. Nothing in the build reaches the network for a signing key.
    prebuild: sed -i '/keystore.properties/d' build.gradle.kts || true

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 1.0.0
CurrentVersionCode: 2

# No AntiFeatures:
#   - NoAds, no tracking, no NonFreeNet: the only network endpoint is Open Food Facts, a free service whose
#     data is ODbL. See docs/03-architecture.md, ADR-006 and ADR-033.
#   - No NonFreeDep: Health Connect is AndroidX (Apache-2.0) at build time and a system module on Android
#     14; on Android 9-13 it is an app installed by the user, and the app says so instead of pretending.
#     Gadgetbridge is FOSS and already in F-Droid.
#   - No NonFreeAssets: the launcher icon is a vector drawn in the repository (tools/icon_design.py).
