# Draft of `metadata/com.balancecalories.yml` for fdroiddata.
#
# This file is the merge-request payload for https://gitlab.com/fdroid/fdroiddata, not something the build
# reads. It is kept here so the recipe can be reviewed together with the commit it builds.
#
# Notes on the two deliberate absences:
#   * no `subdir` - the Gradle project root is the repository root (`settings.gradle.kts` includes :app,
#     :core and :data); `subdir: app` would point the buildserver at a directory with no wrapper.
#   * no `prebuild` - `app/build.gradle.kts` reads `keystore.properties` only when the file exists, so the
#     release build is unsigned without any patching. A `sed` over a Kotlin DSL file would be a way to break
#     the build while looking careful.

Categories:
  - Sports & Health
License: Apache-2.0
AuthorName: shogun-kub
WebSite: https://github.com/shogun-kub/balance-calories
SourceCode: https://github.com/shogun-kub/balance-calories
IssueTracker: https://github.com/shogun-kub/balance-calories/issues
Changelog: https://github.com/shogun-kub/balance-calories/releases

AutoName: Balance Calories

RepoType: git
Repo: https://github.com/shogun-kub/balance-calories.git

Builds:
  - versionName: 1.0.1
    versionCode: 3
    commit: v1.0.1
    gradle:
      - yes
    output: app/build/outputs/apk/release/app-release-unsigned.apk

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 1.0.1
CurrentVersionCode: 3

# No AntiFeatures:
#   - NoAds, no tracking: there is no advertising and no analytics SDK in the build.
#   - No NonFreeNet: the only network endpoints are Open Food Facts (`world.` and `search.` hosts), a free
#     service whose data is ODbL. See docs/03-architecture.md, ADR-006 and ADR-033.
#   - No NonFreeDep: `androidx.health.connect:connect-client` is Apache-2.0 and builds without Play Services.
#     On Android 14 Health Connect is a system module; on Android 9-13 it is an app the user installs, and the
#     app says so on the Today screen instead of failing silently. Gadgetbridge is FOSS and already in F-Droid.
#   - No NonFreeAssets: the launcher icon is a vector drawn in this repository (tools/icon_design.py).
